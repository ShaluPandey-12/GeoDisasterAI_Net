<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signin — GeoDisasterAINet</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Google Fonts -->
  <link href='https://fonts.googleapis.com/css?family=PT+Sans:400,400italic,700,700italic' rel='stylesheet'>
  <!-- Auth CSS -->
  <link href="../static/css/auth.css" rel="stylesheet">
</head>

<body>
  <div class="bg-light" aria-hidden></div>
  <div class="bg-light alt" aria-hidden></div>

  <div class="wrap">
    <div class="card" role="region" aria-label="Signin form">
      <div class="brand">
        <div class="logo">
          <i class="fas fa-sign-in-alt"></i>
        </div>
        <div>
          <h2>GeoDisasterAINet</h2>
          <p class="lead">Sign in to access disaster classification</p>
        </div>
      </div>

      <form action="/signin" method="post">
        {% if message %}
        <div class="alert alert-danger">
          <i class="fas fa-exclamation-circle"></i> {{message}}
        </div>
        {% endif %}
        
        <div class="field">
          <label for="username"><i class="fas fa-user"></i> Username</label>
          <div class="input-with-icon">
            <input name="user" id="username" type="text" placeholder="Enter your username" required>
            <i class="fas fa-user"></i>
          </div>
        </div>

        <div class="field">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <div class="input-with-icon">
            <input name="password" id="password" type="password" placeholder="Enter your password" required>
            <i id="togglePwd" class="fas fa-eye" title="Show/Hide password" aria-hidden="true"></i>
          </div>
        </div>

        <div class="field">
          <button type="submit" class="btn">
            <i class="fas fa-sign-in-alt"></i> Sign In
          </button>
          <div id="formMsg" class="small" role="status" aria-live="polite"></div>
        </div>
      </form>

      <div class="small">
        Don't have an account? <a href="/logon">Sign up here</a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Password toggle
      const pwd = document.getElementById('password');
      const toggle = document.getElementById('togglePwd');
      const form = document.querySelector('form');
      
      if (toggle && pwd) {
        toggle.addEventListener('click', () => {
          if (pwd.type === 'password') {
            pwd.type = 'text';
            toggle.classList.remove('fa-eye');
            toggle.classList.add('fa-eye-slash');
          } else {
            pwd.type = 'password';
            toggle.classList.remove('fa-eye-slash');
            toggle.classList.add('fa-eye');
          }
        });
      }

      // Form submission with loading state
      if (form) {
        form.addEventListener('submit', function(e) {
          const btn = form.querySelector('.btn');
          if (btn) {
            btn.classList.add('loading');
            btn.disabled = true;
          }
        });
      }

      // Input focus animations
      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => {
        input.addEventListener('focus', function() {
          this.parentElement.classList.add('focused');
        });
        input.addEventListener('blur', function() {
          this.parentElement.classList.remove('focused');
        });
      });
    })();
  </script>
</body>

</html>
